<!DOCTYPE html>
<html lang="zh-Hant" data-theme="oat">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>微光漫遊 Luma Wander</title>
<meta name="theme-color" content="#4A5D4E">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--amber:#FFBF00;--lilac:#E8D5E5;--glow:#FFBF00;--r:20px}
html[data-theme=oat]{--bg:#F4F1EA;--ink:#2B323B;--sub:#6A6F73;--edge:#4A5D4E}
html[data-theme=night]{--bg:#2B323B;--ink:#F4F1EA;--sub:#A9AEB0;--edge:#4A5D4E}
html[data-theme=moss]{--bg:#4A5D4E;--ink:#F4F1EA;--sub:#DCE4DE;--edge:#2F3E33}
:root{--line:color-mix(in srgb,var(--ink) 14%,transparent);--sf:color-mix(in srgb,var(--ink) 7%,transparent)}
*{box-sizing:border-box;margin:0}
html{height:100%;background:var(--bg);transition:background .6s}
body{min-height:100%;font:16px/1.7 "Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);
 padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0));transition:background .6s,color .6s;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.cmp:focus-visible,.tile:focus-within{outline:2px solid var(--ink);outline-offset:3px}
main{max-width:480px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 6px}
.pts b{font-size:26px;font-weight:400;letter-spacing:.02em}
.pts i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px 2px var(--amber);margin-right:8px}
.pts small{display:block;color:var(--sub);font-size:13px;line-height:1.3}
.themes{display:flex;gap:10px}
.themes button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);position:relative}
.themes button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.themes [data-t=oat]{background:#F4F1EA}.themes [data-t=night]{background:#2B323B}.themes [data-t=moss]{background:#4A5D4E}

/* views */
.view{padding-top:8px}
h2{font-size:15px;font-weight:400;color:var(--sub);margin:28px 0 6px}
.lead{font-size:22px;line-height:1.5;text-align:center;min-height:2lh;margin:4px 0 14px}

/* luma */
.stage{position:relative;display:grid;place-items:center;padding:6px 0}
.luma{width:min(66vw,270px);height:auto;overflow:visible;cursor:pointer;display:block}
.luma .halo{opacity:.4;transition:fill .9s;animation:pulse 5s ease-in-out infinite}
.luma .body{transform-origin:100px 204px;animation:breathe 4.5s ease-in-out infinite}
.luma .sprout{transform-origin:100px 52px;transform:scale(0);transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.luma.has .sprout{transform:scale(1)}
.luma .eo{display:block}.luma .ec,.luma .zz{display:none}
.luma.asleep .eo{display:none}.luma.asleep .ec,.luma.asleep .zz{display:block}
.luma.asleep .body{animation-duration:7s}
.luma.joy .body{animation:hop .9s ease-out}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
@keyframes pulse{50%{opacity:.62}}
@keyframes hop{30%{transform:translateY(-16px) scale(.97,1.04)}60%{transform:translateY(0) scale(1.05,.95)}}
.fl{position:absolute;top:30%;left:50%;font-size:26px;pointer-events:none;animation:fl 1.5s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}

.banner{margin:6px 0 0;padding:14px 16px;border-radius:var(--r);background:var(--sf);font-size:15px}
.sw{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sw i{width:26px;height:26px;border-radius:50%;border:1px solid var(--line)}

.pc{position:relative;margin-top:10px;padding:16px 18px 16px 18px;border-radius:6px;background:color-mix(in srgb,var(--ink) 4%,var(--bg));border:1px solid var(--line);overflow:hidden}
.pc .st{height:6px;display:flex;margin:-16px -18px 12px}
.pc .st i{flex:1}
.pc p{font-size:15px}.pc small{color:var(--sub)}
.pc .stamp{position:absolute;right:14px;top:22px;width:44px;height:44px;border-radius:50%;border:1.5px dashed var(--sub);display:grid;place-items:center;color:var(--sub);font-size:12px;transform:rotate(8deg)}

/* tasks */
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1}.row .t small{display:block;color:var(--sub);font-size:13px;line-height:1.4}
.row .p{color:var(--sub);font-size:14px;min-width:2.6em;text-align:right}
.btn{padding:.45em 1.1em;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* compare slider */
.cmp{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:var(--r);touch-action:pan-y;user-select:none;background:var(--sf)}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .bf{clip-path:inset(0 calc(100% - var(--p,50%)) 0 0);filter:saturate(.55) brightness(.92)}
.cmp .hd{position:absolute;top:0;bottom:0;left:var(--p,50%);width:2px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.25)}
.cmp .hd b{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center;font-weight:400;font-size:13px;color:#2B323B;letter-spacing:-2px}
.cmp .tg{position:absolute;bottom:10px;padding:2px 10px;border-radius:99px;background:rgba(43,50,59,.62);color:#fff;font-size:12px}
.cmp .tg.l{left:10px}.cmp .tg.r{right:10px}
.card{margin-top:18px}
.meta{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--sub);font-size:14px}
.meta i{width:16px;height:16px;border-radius:50%}
.meta button{margin-left:auto;color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--sub);padding:26px 0}

/* slips */
.slip{display:flex;align-items:center;gap:12px;padding:16px;margin-top:12px;border-radius:var(--r);background:var(--sf);border-left:5px solid var(--amber)}
.slip .t{flex:1}.slip .t b{font-weight:400;font-size:18px;display:block}.slip .t small{color:var(--sub);font-size:13px}

/* dialogs */
dialog{border:0;border-radius:24px;background:var(--bg);color:var(--ink);padding:22px;width:min(92vw,400px);max-height:90vh;overflow:auto;margin:auto}
dialog::backdrop{background:rgba(43,50,59,.55);backdrop-filter:blur(3px)}
dialog h3{font-weight:400;font-size:20px;margin-bottom:12px}
dialog .act{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:3/4;border-radius:var(--r);border:1.5px dashed var(--sub);display:grid;place-items:center;text-align:center;cursor:pointer;overflow:hidden;font-size:15px}
.tile small{color:var(--sub)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.tile.set{border-style:solid;border-color:transparent}.tile.set img{display:block}.tile.set span{display:none}
.ring{display:block;margin:6px auto;width:150px;height:150px}
.ring circle{fill:none;stroke-width:8}
.ring .tr{stroke:var(--line)}.ring .pg{stroke:var(--ink);stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset .5s}
.ring text{fill:var(--ink);font-size:20px;text-anchor:middle;dominant-baseline:central;font-family:inherit}
.gold{position:relative;overflow:hidden;border-radius:18px;padding:26px 22px;color:#2B323B;text-align:center;
 background:linear-gradient(135deg,#FFBF00 0%,#FFD966 45%,#E8D5E5 100%);box-shadow:0 10px 36px -8px #FFBF00;animation:drop .8s cubic-bezier(.2,1.2,.4,1)}
.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-100%);animation:shine 1.6s .5s ease-out forwards}
.gold h3{font-size:26px;margin:6px 0 4px}.gold p{font-size:15px}
.gold .luma{width:110px;margin:0 auto}
.sp{position:absolute;bottom:-10px;width:7px;height:7px;border-radius:50%;background:#fff;opacity:0;animation:up 2.4s ease-out infinite}
@keyframes drop{from{opacity:0;transform:translateY(-36px) rotate(-7deg) scale(.88)}}
@keyframes shine{to{transform:translateX(100%)}}
@keyframes up{20%{opacity:.9}to{opacity:0;transform:translateY(-300px)}}

/* nav + toast */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
nav div{max-width:480px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{padding:14px 0 12px;font-size:15px;color:var(--sub);position:relative}
nav button[aria-current=true]{color:var(--ink)}
nav button[aria-current=true]::after{content:"";position:absolute;left:50%;bottom:5px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:.55em 1.2em;border-radius:99px;font-size:15px;opacity:0;pointer-events:none;transition:.4s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <radialGradient id="bg" cx="38%" cy="30%" r="80%">
  <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
  <stop offset=".42" style="stop-color:var(--glow)" stop-opacity=".6"/>
  <stop offset="1" style="stop-color:var(--edge)" stop-opacity=".92"/>
 </radialGradient>
 <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
</defs></svg>

<main>
 <header class="top">
  <div class="pts"><b><i></i><span id="bal">0</span></b><small>微光點數 · 累積 <span id="earned">0</span></small></div>
  <div class="themes" role="group" aria-label="背景色">
   <button data-t="oat" aria-label="燕麥灰"></button><button data-t="night" aria-label="深藍灰"></button><button data-t="moss" aria-label="苔綠"></button>
  </div>
 </header>

 <section class="view" data-view="home">
  <div class="stage" id="stage"></div>
  <p class="lead" id="line">你在這裡就好</p>
  <div class="banner" id="banner" hidden></div>
  <div id="pcWrap"></div>
 </section>

 <section class="view" data-view="tasks" hidden><div id="tasks"></div></section>

 <section class="view" data-view="cards" hidden>
  <h2>對比卡片</h2><div id="cards"></div>
 </section>

 <section class="view" data-view="slips" hidden>
  <h2>用點數換一張許可，不必有罪惡感</h2><div id="slips"></div>
 </section>
</main>

<nav><div>
 <button data-go="home">小苔</button><button data-go="tasks">微光</button><button data-go="cards">卡片</button><button data-go="slips">許可</button>
</div></nav>

<dialog id="tidyDlg">
 <h3>整理一個小角落</h3>
 <div class="tiles">
  <label class="tile"><input type="file" accept="image/*" id="fb" hidden><span>之前<br><small>拍下混沌</small></span><img alt="之前"></label>
  <label class="tile"><input type="file" accept="image/*" id="fa" hidden><span>之後<br><small>喚醒微光</small></span><img alt="之後"></label>
 </div>
 <div class="act"><button class="btn ghost" id="tidyX">先不要</button><button class="btn" id="mk" disabled>生成卡片</button></div>
</dialog>

<dialog id="walkDlg">
 <h3>出門走三分鐘</h3>
 <svg class="ring" viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" id="pg" cx="60" cy="60" r="52" stroke-dasharray="327" stroke-dashoffset="327"/><text x="60" y="60" id="wt">0:00</text></svg>
 <p style="text-align:center;color:var(--sub);font-size:14px">隨時回來都算數</p>
 <div class="act"><button class="btn ghost" id="walkX">先不要</button><button class="btn" id="walkGo">開始走</button></div>
</dialog>

<dialog id="slipDlg"><div class="gold" id="gold"></div><div class="act"><button class="btn" id="slipOk">收下</button></div></dialog>
<dialog id="pcDlg"><div id="pcBody"></div><div class="act"><button class="btn" id="pcOk">收下</button></div></dialog>

<input type="file" accept="image/*" id="colorIn" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- state ---------- */
const KEY='luma.v1',H=36e5;
const def={earned:0,spent:0,colors:[],cards:[],log:{},postcards:[],lastVisit:0,theme:'oat'};
let S;try{S={...def,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{S={...def}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{toast('儲存空間滿了，刪掉一張舊卡片就能再存')}};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const today=()=>new Date().toLocaleDateString('sv');
const fmt=ts=>new Date(ts).toLocaleDateString('zh-TW',{month:'long',day:'numeric'});

/* ---------- data ---------- */
const TASKS=[
 {id:'tidy',cat:'室內微整理',title:'整理一個小角落',hint:'1–3 分鐘，拍下前後',pts:30,type:'tidy'},
 {id:'walk',cat:'室外微散步',title:'出門走三分鐘',hint:'隨時回來都算數',pts:30,type:'walk'},
 {id:'color',cat:'室外微散步',title:'拍下路邊的一個顏色',hint:'植物、天空都可以',pts:20,type:'color'},
 {id:'hair',cat:'自我悅納',title:'換髮型，或化妝出門',pts:40},
 {id:'make',cat:'自我悅納',title:'完成一件小作品',pts:50},
 {id:'cloth',cat:'自我悅納',title:'買一件新衣服',pts:40},
 {id:'plant',cat:'自我悅納',title:'照顧一盆植物',pts:10},
 {id:'move',cat:'身心律動',title:'5 分鐘健康操',pts:30},
 {id:'dance',cat:'身心律動',title:'隨音樂亂舞一首',pts:30}
];
const SLIPS=[
 {t:'今日不減肥',s:'買一塊蛋糕，吃得開心',c:40},
 {t:'鹹酥雞配追劇',s:'今晚不必補償任何事',c:50},
 {t:'完全躺平許可',s:'今天可以沒有產出',c:30},
 {t:'晚點再回覆許可',s:'訊息先放著也沒關係',c:20}
];
const LINES=['你在這裡就好','今天辛苦了，我們慢慢來','不用急，光會自己亮','有你在，這裡就很暖'];
const CHEER=['收到了，我看見了','這樣就很好','光亮了一點點','辛苦了，慢慢來'];
const SPECIAL=[['晨霧小鎮','一小罐薄荷色的霧'],['海邊車站','一枚被浪磨圓的玻璃片'],['山腰茶亭','一片剛好的午後陽光'],['雨後巷口','一滴還沒落下的雨'],['舊書店','一張夾著花瓣的書籤']];

/* ---------- luma component ---------- */
const luma=()=>`<svg class="luma" viewBox="0 -10 200 240" role="img" aria-label="小苔">
<ellipse class="halo" cx="100" cy="140" rx="92" ry="86" style="fill:var(--glow)" filter="url(#blur)"/>
<g class="body">
 <g class="sprout"><path d="M100 54V20" stroke="#4A5D4E" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M100 36C84 34 76 22 80 14C94 14 102 24 100 36Z" fill="#7C9A80"/><path d="M100 30C116 28 124 16 120 8C106 8 98 18 100 30Z" fill="#9DB89F"/><circle cx="100" cy="16" r="6.5" fill="#FFBF00"/></g>
 <path d="M100 52C148 52 176 96 172 138C168 182 136 204 100 204C64 204 32 182 28 138C24 96 52 52 100 52Z" fill="url(#bg)"/>
 <g fill="#4A5D4E" opacity=".3"><circle cx="58" cy="176" r="6"/><circle cx="72" cy="188" r="4"/><circle cx="146" cy="170" r="7"/><circle cx="132" cy="190" r="4"/><circle cx="154" cy="116" r="3"/></g>
 <ellipse cx="74" cy="92" rx="22" ry="11" fill="#fff" opacity=".38" transform="rotate(-25 74 92)"/>
 <g class="eo" fill="#2B323B"><circle cx="78" cy="130" r="6"/><circle cx="122" cy="130" r="6"/></g>
 <g class="ec" fill="none" stroke="#2B323B" stroke-width="3" stroke-linecap="round"><path d="M70 130Q78 137 86 130"/><path d="M114 130Q122 137 130 130"/></g>
 <ellipse cx="62" cy="150" rx="9" ry="6" fill="#E8D5E5" opacity=".85"/><ellipse cx="138" cy="150" rx="9" ry="6" fill="#E8D5E5" opacity=".85"/>
 <path d="M92 150Q100 157 108 150" fill="none" stroke="#2B323B" stroke-width="3" stroke-linecap="round"/>
 <text class="zz" x="150" y="70" font-size="22" fill="currentColor" opacity=".6">z</text>
</g></svg>`;
$('#stage').innerHTML=luma();

/* ---------- ui helpers ---------- */
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
const say=t=>$('#line').textContent=t;
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function joy(){$$('.luma').forEach(l=>{l.classList.remove('joy');void l.getBoundingClientRect();l.classList.add('joy');setTimeout(()=>l.classList.remove('joy'),950)})}
function floatPts(n){const e=document.createElement('div');e.className='fl';e.textContent='+'+n;$('#stage').append(e);setTimeout(()=>e.remove(),1500)}
function applyGlow(){document.documentElement.style.setProperty('--glow',S.colors[0]||'#FFBF00');$$('.luma').forEach(l=>l.classList.toggle('has',S.colors.length>0))}
function applyTheme(){document.documentElement.dataset.theme=S.theme;$$('.themes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===S.theme));$('meta[name=theme-color]').content={oat:'#F4F1EA',night:'#2B323B',moss:'#4A5D4E'}[S.theme]}
function go(v){$$('.view').forEach(s=>s.hidden=s.dataset.view!==v);$$('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===v));scrollTo(0,0)}

/* ---------- points ---------- */
const bal=()=>S.earned-S.spent;
function renderPts(){$('#bal').textContent=bal();$('#earned').textContent=S.earned;renderSlips()}
function award(p){S.earned+=p;save();renderPts();floatPts(p);joy();say(rnd(CHEER));toast('+'+p+' 微光點數')}
function addColor(hex){S.colors.unshift(hex);S.colors=S.colors.slice(0,12);applyGlow();save();renderHome()}
function finish(t,p){const d=today();S.log[d]=S.log[d]||{};S.log[d][t.id]=(S.log[d][t.id]||0)+1;award(p);renderTasks()}

/* ---------- tasks ---------- */
function renderTasks(){
 const log=S.log[today()]||{};let h='',cat='';
 TASKS.forEach(t=>{
  if(t.cat!==cat){cat=t.cat;h+=`<h2>${cat}</h2>`}
  const n=log[t.id];
  h+=`<div class="row"><div class="t">${t.title}<small>${t.hint||''}${n?(t.hint?' · ':'')+'今天 '+n+' 次':''}</small></div><span class="p">+${t.pts}</span><button class="btn" data-task="${t.id}">完成</button></div>`;
 });
 $('#tasks').innerHTML=h;
}
$('#tasks').addEventListener('click',e=>{
 const b=e.target.closest('[data-task]');if(!b)return;
 const t=TASKS.find(x=>x.id===b.dataset.task);
 if(t.type==='tidy')return openTidy();
 if(t.type==='walk')return openWalk();
 if(t.type==='color')return $('#colorIn').click();
 finish(t,t.pts);
});

/* ---------- image + color ---------- */
const loadImg=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u});
function shrink(img,max=480){const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k|0;c.height=img.height*k|0;c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}
function dominant(cv){
 const s=document.createElement('canvas');s.width=s.height=48;const x=s.getContext('2d');x.drawImage(cv,0,0,48,48);
 const d=x.getImageData(0,0,48,48).data,m={};
 for(let i=0;i<d.length;i+=4){
  const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),w=.2+(mx?(mx-mn)/mx:0),k=(r>>5)<<6|(g>>5)<<3|b>>5,o=m[k]||(m[k]={w:0,r:0,g:0,b:0});
  o.w+=w;o.r+=r*w;o.g+=g*w;o.b+=b*w;
 }
 const t=Object.values(m).sort((a,b)=>b.w-a.w)[0];
 return '#'+[t.r,t.g,t.b].map(v=>Math.round(v/t.w).toString(16).padStart(2,'0')).join('');
}
$('#colorIn').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{addColor(dominant(shrink(await loadImg(f))));finish(TASKS.find(t=>t.id==='color'),20)}catch{toast('這張圖讀不了，換一張試試')}
});

/* ---------- before/after slider ---------- */
function slider(b,a){
 const el=document.createElement('div');el.className='cmp';el.tabIndex=0;
 el.setAttribute('role','slider');el.setAttribute('aria-label','之前與之後對比');el.setAttribute('aria-valuemin',0);el.setAttribute('aria-valuemax',100);
 el.innerHTML=`<img src="${a}" alt="之後"><img class="bf" src="${b}" alt="之前"><div class="hd"><b>‹›</b></div><span class="tg l">混沌</span><span class="tg r">微光</span>`;
 let p=50;const set=v=>{p=Math.max(0,Math.min(100,v));el.style.setProperty('--p',p+'%');el.setAttribute('aria-valuenow',Math.round(p))};set(50);
 const mv=e=>{const r=el.getBoundingClientRect();set((e.clientX-r.left)/r.width*100)};
 el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);mv(e);el.onpointermove=mv});
 el.addEventListener('pointerup',()=>el.onpointermove=null);
 el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')set(p-5);if(e.key==='ArrowRight')set(p+5)});
 return el;
}

/* ---------- tidy flow ---------- */
const T={};
function openTidy(){
 T.b=T.a=null;$('#mk').disabled=true;
 $$('#tidyDlg .tile').forEach(t=>{t.classList.remove('set');$('input',t).value=''});
 $('#tidyDlg').showModal();
}
async function pick(inp,k){
 const f=inp.files[0];if(!f)return;
 try{const c=shrink(await loadImg(f));T[k]=c;const t=inp.parentElement;$('img',t).src=c.toDataURL('image/jpeg',.7);t.classList.add('set');$('#mk').disabled=!(T.b&&T.a)}
 catch{toast('這張圖讀不了，換一張試試')}
}
$('#fb').onchange=e=>pick(e.target,'b');$('#fa').onchange=e=>pick(e.target,'a');
$('#tidyX').onclick=()=>$('#tidyDlg').close();
$('#mk').onclick=()=>{
 const hex=dominant(T.a);
 S.cards.unshift({id:Date.now(),b:T.b.toDataURL('image/jpeg',.7),a:T.a.toDataURL('image/jpeg',.7),c:hex,ts:Date.now()});
 addColor(hex);finish(TASKS.find(t=>t.id==='tidy'),30);
 $('#tidyDlg').close();renderCards();go('cards');
};
function renderCards(){
 const box=$('#cards');box.innerHTML='';
 if(!S.cards.length){box.innerHTML='<p class="empty">還沒有卡片。整理一個小角落，拍下前後，這裡就會亮起來。</p>';return}
 S.cards.forEach(c=>{
  const w=document.createElement('div');w.className='card';w.append(slider(c.b,c.a));
  const m=document.createElement('div');m.className='meta';
  m.innerHTML=`<i style="background:${c.c}"></i><span>${fmt(c.ts)} · ${c.c}</span><button type="button">刪除</button>`;
  $('button',m).onclick=()=>{S.cards=S.cards.filter(x=>x.id!==c.id);save();renderCards()};
  w.append(m);box.append(w);
 });
}

/* ---------- walk ---------- */
let wi=null,w0=0;
const walkSec=()=>Math.floor((Date.now()-w0)/1000);
function walkTick(){const s=walkSec();$('#wt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('#pg').style.strokeDashoffset=327*(1-Math.min(1,s/180))}
function openWalk(){clearInterval(wi);wi=null;$('#wt').textContent='0:00';$('#pg').style.strokeDashoffset=327;$('#walkGo').textContent='開始走';$('#walkDlg').showModal()}
$('#walkGo').onclick=()=>{
 if(!wi){w0=Date.now();wi=setInterval(walkTick,500);$('#walkGo').textContent='回來了';return}
 const s=walkSec();clearInterval(wi);wi=null;$('#walkDlg').close();
 finish(TASKS.find(t=>t.id==='walk'),s>=180?30:15);
};
$('#walkX').onclick=()=>$('#walkDlg').close();
$('#walkDlg').addEventListener('close',()=>{clearInterval(wi);wi=null});

/* ---------- permission slips ---------- */
function renderSlips(){
 const b=bal();
 $('#slips').innerHTML=SLIPS.map((s,i)=>`<div class="slip"><div class="t"><b>${s.t}</b><small>${s.s}</small></div><button class="btn" data-slip="${i}" ${b<s.c?'disabled':''}>${b<s.c?'還差 '+(s.c-b)+' 點':'兌換 '+s.c+' 點'}</button></div>`).join('');
}
$('#slips').addEventListener('click',e=>{
 const k=e.target.closest('[data-slip]');if(!k)return;
 const s=SLIPS[k.dataset.slip];if(bal()<s.c)return;
 S.spent+=s.c;save();renderPts();
 const sp=Array.from({length:14},()=>`<i class="sp" style="left:${Math.random()*100}%;animation-delay:${Math.random()*2}s"></i>`).join('');
 $('#gold').innerHTML=sp+luma()+`<h3>${s.t}</h3><p>${s.s}<br>這張許可，現在生效。</p>`;
 applyGlow();$('#slipDlg').showModal();
});
$('#slipOk').onclick=()=>$('#slipDlg').close();

/* ---------- offline wander ---------- */
function wander(){
 const now=Date.now(),last=S.lastVisit;S.lastVisit=now;
 if(!last)return{tier:'new'};
 const dt=now-last,h=Math.max(1,Math.round(dt/H));
 if(dt<2*H)return{tier:'rest',dt,h};
 if(dt<24*H)return{tier:'out',dt,h};
 const [place,item]=SPECIAL[Math.floor(last/H)%SPECIAL.length];
 const card={ts:now,place,item,hours:h,colors:S.colors.slice(0,5)};
 S.postcards.unshift(card);S.postcards=S.postcards.slice(0,20);S.earned+=20;
 return{tier:'postcard',dt,h,card};
}
const pcHTML=c=>{
 const cs=c.colors.length?c.colors:['#E8D5E5','#FFBF00'];
 return `<div class="pc"><div class="st">${cs.map(x=>`<i style="background:${x}"></i>`).join('')}</div><span class="stamp">微光</span><p>小苔在「${c.place}」待了 ${c.hours} 小時，<br>帶回${c.item}。</p><small>${fmt(c.ts)}</small></div>`;
};
function applyWander(r){
 const L=$('.luma'),b=$('#banner'),sw=()=>S.colors.length?`<div class="sw">${S.colors.slice(0,6).map(c=>`<i style="background:${c}"></i>`).join('')}</div>`:'';
 L.classList.toggle('asleep',r.tier==='rest');
 b.hidden=r.tier==='new';
 if(r.tier==='rest'){b.textContent='小苔在房間裡睡著了，輕點牠叫醒。';say('嘘，小苔在睡')}
 if(r.tier==='out'){b.innerHTML=`小苔出門逛了約 ${r.h} 小時，剛回來。${S.colors.length?'帶著你收集的顏色。':'還沒有顏色可以帶，下次拍一個給牠吧。'}`+sw()}
 if(r.tier==='postcard'){b.innerHTML=`小苔離開了 ${r.h} 小時，帶回一張明信片。+20 微光點數`+sw();$('#pcBody').innerHTML=pcHTML(r.card);$('#pcDlg').showModal();renderPts()}
}
$('#pcOk').onclick=()=>$('#pcDlg').close();
function renderHome(){$('#pcWrap').innerHTML=S.postcards[0]?'<h2>最近的明信片</h2>'+pcHTML(S.postcards[0]):''}

const stamp=()=>{S.lastVisit=Date.now();save()};
addEventListener('pagehide',stamp);
document.addEventListener('visibilitychange',()=>{
 if(document.hidden)return stamp();
 if(Date.now()-S.lastVisit>=2*H){applyWander(wander());save()}
});

/* ---------- init ---------- */
$('#stage').addEventListener('click',()=>{
 const l=$('.luma');
 if(l.classList.contains('asleep')){l.classList.remove('asleep');$('#banner').hidden=true;say('你來了，我們慢慢來')}
 else say(rnd(LINES));
 joy();
});
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
$$('.themes button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;applyTheme();save()});
applyTheme();applyGlow();renderPts();renderTasks();renderCards();renderHome();go('home');
const r=wander();applyWander(r);save();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
