<!DOCTYPE html>
<html lang="zh-Hant" data-theme="oat">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>微光漫遊 Luma Wander</title>
<meta name="theme-color" content="#4A5D4E">
<script>try{var t=JSON.parse(localStorage.getItem('luma.v1')).theme;if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--amber:#FFBF00;--lilac:#E8D5E5;--glow:#FFBF00;--r:20px}
html[data-theme=oat]{--bg:#F4F1EA;--ink:#2B323B;--sub:#6A6F73;--edge:#4A5D4E}
html[data-theme=night]{--bg:#2B323B;--ink:#F4F1EA;--sub:#A9AEB0;--edge:#4A5D4E}
html[data-theme=moss]{--bg:#4A5D4E;--ink:#F4F1EA;--sub:#DCE4DE;--edge:#2F3E33}
:root{--line:color-mix(in srgb,var(--ink) 14%,transparent);--sf:color-mix(in srgb,var(--ink) 7%,transparent)}
*{box-sizing:border-box;margin:0}
html{height:100%;background:var(--bg);transition:background .6s}
body{min-height:100%;font:16px/1.7 "Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg);
 padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0));transition:background .6s,color .6s;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.cmp:focus-visible,.tile:focus-within{outline:2px solid var(--ink);outline-offset:3px}
main{max-width:480px;margin:0 auto;padding:0 20px}
[hidden]{display:none!important}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 6px}
.pts b{font-size:26px;font-weight:400;letter-spacing:.02em}
.pts i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px 2px var(--amber);margin-right:8px}
.pts small{display:block;color:var(--sub);font-size:13px;line-height:1.3}
.themes{display:flex;gap:10px}
.themes button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);position:relative}
.themes button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.themes [data-t=oat]{background:#F4F1EA}.themes [data-t=night]{background:#2B323B}.themes [data-t=moss]{background:#4A5D4E}

/* views */
.view{padding-top:8px}
h2{font-size:15px;font-weight:400;color:var(--sub);margin:28px 0 6px}
.lead{font-size:22px;line-height:1.5;text-align:center;min-height:2lh;margin:4px 0 14px}

/* luma */
:root{--img-wood:none;--img-rug:none}
.stage{position:relative;display:grid;place-items:center;padding:14px 0 0;border-radius:var(--r);overflow:hidden;transition:background .6s}
.stage i,.stage .cat{position:absolute;display:none;pointer-events:none;z-index:1}
.stage .luma{position:relative;z-index:2;width:min(58vw,240px)}
.stage.on-wood{background:color-mix(in srgb,var(--ink) 6%,var(--bg))}
.stage.on-wood .floor{display:block;left:0;right:0;bottom:0;height:36%;background-image:var(--img-wood),repeating-linear-gradient(90deg,#b98a5a 0 46px,#a67846 46px 48px),linear-gradient(#c79a67,#a8794a);background-size:cover,auto,auto;box-shadow:inset 0 10px 18px -10px rgba(0,0,0,.35)}
.stage.on-rug .rug{display:block;left:50%;bottom:6%;width:70%;height:20%;transform:translateX(-50%);border-radius:50%;background-image:var(--img-rug),radial-gradient(ellipse at center,#E8D5E5 0 40%,#d9bdd4 41% 58%,#E8D5E5 59% 100%);background-size:cover,auto;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.stage.on-lamp .lamp{display:block;right:9%;bottom:26%;width:6px;height:92px;background:#6b5a48;border-radius:3px}
.stage.on-lamp .lamp::before{content:"";position:absolute;left:50%;top:-22px;width:38px;height:24px;margin-left:-19px;border-radius:19px 19px 4px 4px;background:var(--amber);box-shadow:0 0 46px 20px rgba(255,191,0,.42)}
.stage.on-cat .cat{display:block;right:5%;bottom:5%;width:70px;height:52px;animation:bob 5s ease-in-out infinite}
.cat svg,.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
@keyframes bob{50%{transform:translateY(-4px)}}
.luma{transition:transform 1s,filter 1s}
.luma .halo{transform-origin:100px 140px}
.luma .st2up,.luma .st3up,.luma .b2,.luma .b3,.luma .crown{opacity:0;transition:opacity .9s}
.luma.st2 .st2up,.luma.st3 .st2up,.luma.st3 .st3up,.luma.b2:not(.st1) .b2,.luma.b3:not(.st1) .b3{opacity:1}
.stage.on-crown .luma .crown{opacity:1}
.luma .bud{transform:translateY(32px);transition:transform .9s}
.luma.st2 .bud,.luma.st3 .bud{transform:none}
.luma.st1.has .sprout{transform:scale(.85)}
.luma.st3.has .sprout{transform:scale(1.12)}
.luma .aura{opacity:0;stroke-width:3;stroke-dasharray:4 14;stroke-linecap:round;transform-origin:100px 140px;transition:opacity 1s}
.luma.st3 .aura{opacity:.75;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.luma.st2 .halo,.luma.st3 .halo{opacity:.55}
.luma.joy .halo{animation:flash 1.1s ease-out}
@keyframes flash{30%{opacity:.95;transform:scale(1.12)}}
.stage .luma.small{transform:scale(.78);transform-origin:50% 92%;filter:saturate(.7)}
.luma.small .halo{animation:none;opacity:.2}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at 50% 75%,rgba(255,191,0,var(--w,0)),transparent 72%);transition:opacity .8s}
.stage.lv2 .win{display:block;left:8%;top:12%;width:54px;height:66px;border:3px solid #b98a5a;border-radius:27px 27px 3px 3px;background:linear-gradient(#cfe6f2,#f3e7c6)}
.stage.lv2 .win::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#b98a5a}
.stage.lv2 .win::after{content:"";position:absolute;top:55%;left:0;right:0;height:2px;background:#b98a5a}
.stage.lv3 .pic{display:block;right:14%;top:14%;width:44px;height:36px;border:3px solid #b98a5a;background:linear-gradient(135deg,#E8D5E5,#FFBF00)}
.stage.lv3 .lights{display:block;left:0;right:0;top:0;height:18px;background:radial-gradient(circle at 10px 9px,#FFBF00 0 3px,transparent 4px) 0 0/28px 18px repeat-x;opacity:.85}
.stage .stool{display:block;left:4%;bottom:7%;width:50px;height:30px;background:linear-gradient(#8a5f33,#8a5f33) 14% 100%/6px 22px no-repeat,linear-gradient(#8a5f33,#8a5f33) 86% 100%/6px 22px no-repeat}
.stage .stool::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;border-radius:5px;background:#b98a5a}
.guest{position:absolute;z-index:4;left:calc(4% + 2px);bottom:calc(7% + 27px);width:46px;height:46px;padding:0;animation:gin 1.2s ease-out}
.guest svg{width:100%;height:100%;display:block}
@keyframes gin{from{opacity:0;transform:translateY(8px)}}
.gb{position:absolute;z-index:5;left:3%;bottom:calc(7% + 84px);max-width:62%;padding:8px 12px;border-radius:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:14px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.12);pointer-events:none;animation:gin .4s}
.stbar{margin:12px 0 0}
.stl{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stl b{font-weight:400;font-size:17px}.stl small{color:var(--sub);font-size:13px;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:3px;transition:width .8s}
.shr{display:flex;justify-content:center;margin-top:-4px}
.lvrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:14px;color:var(--sub)}
.lvbook{text-align:center}.lvbook h3{font-size:21px;line-height:1.5;margin:6px 0 4px}
.lvs{color:var(--sub);font-size:14px;margin-bottom:8px}
#lvLuma .luma{width:110px;margin:0 auto;display:block}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin-top:10px;border-radius:18px;background:var(--sf);border:1.5px solid transparent}
.opt.on{border-color:var(--ink)}
#splash{position:fixed;inset:0;z-index:200;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;color:var(--ink);
 background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--glow) 24%,transparent),transparent 62%),var(--bg);transition:opacity .7s;animation:splashOut .8s 6s forwards}
#splash.out{opacity:0;pointer-events:none}
#splash .luma{width:min(46vw,180px);display:block;margin:0 auto}
#splash p{font-size:16px;letter-spacing:.08em;color:var(--sub);animation:txt 2.4s ease-in-out infinite}
@keyframes txt{50%{opacity:.5}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
#onb{position:fixed;inset:0;z-index:150;overflow:auto;background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--glow) 18%,transparent),transparent 60%),var(--bg);transition:opacity .7s}
#onb.out{opacity:0;pointer-events:none}
.ob{max-width:440px;margin:0 auto;min-height:100%;padding:calc(28px + env(safe-area-inset-top,0)) 22px calc(28px + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;justify-content:center;text-align:center}
#obL .luma{width:120px;margin:0 auto 8px;display:block}
.pgin{animation:fin2 .7s ease-out}
@keyframes fin2{from{opacity:0;transform:translateY(10px)}}
.obT{font-weight:400;font-size:27px;line-height:1.7;margin:10px 0 14px}
.obP{color:var(--sub);font-size:16px;line-height:1.9}
.obA{margin-top:26px}
.obS{color:var(--sub);font-size:14px;margin:6px 0}
.obQ{font-weight:400;font-size:21px;line-height:1.5;margin:6px 0 10px}
.obN{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--amber)}
.obG,.obH{font-size:14px;color:var(--sub);margin-top:10px;line-height:1.7}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0));width:min(92vw,440px);display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:18px;background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:15;text-align:left;font-size:14px;line-height:1.55;animation:hin .5s}
#hint small{color:var(--sub);white-space:nowrap}
.hn{flex:none;width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
@keyframes hin{from{opacity:0}}
.opt b{font-weight:400;font-size:16px;display:block;line-height:1.4}.opt small{color:var(--sub);font-size:13px}
.og{flex:none;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--amber));opacity:calc(.3 + var(--g)*.7);box-shadow:0 0 calc(var(--g)*16px) rgba(255,191,0,.8)}
.peek{opacity:.45;pointer-events:none;-webkit-mask-image:linear-gradient(#000 20%,transparent);mask-image:linear-gradient(#000 20%,transparent)}
.ic2{position:relative;display:block;width:100%;height:100%}
.ic2 svg,.ic2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.calh{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.calh b{font-weight:400;font-size:17px}.calh .gear{font-size:22px;text-decoration:none;padding:0 10px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;color:var(--sub);font-size:13px}
.day,.blank{aspect-ratio:1}
.day{position:relative;padding:0;border-radius:12px;
 background:radial-gradient(circle at 20% 30%,rgba(120,100,70,.14) 0 1px,transparent 2px) 0 0/9px 9px,radial-gradient(circle at 70% 60%,rgba(120,100,70,.1) 0 1px,transparent 2px) 0 0/13px 13px,color-mix(in srgb,#cdbf9f 24%,transparent)}
.day:disabled{cursor:default}
.day .dn{position:absolute;left:6px;top:3px;font-size:11px;color:var(--sub);z-index:1}
.day .ico{position:absolute;inset:16% 10% 6%}
.day.has{background:color-mix(in srgb,var(--mc) 34%,transparent)}
.day.has:not(.rel) .ico{filter:drop-shadow(0 0 5px rgba(255,191,0,.55))}
.day.today{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.day.pop .ico{animation:popin .7s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.2);opacity:0}}
.calnote{color:var(--sub);font-size:13px;margin-top:12px}
.grp{display:block;color:var(--sub);font-size:13px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:99px;border:1px solid var(--line);font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip .ic2{width:28px;height:28px}
#moodTx{width:100%;padding:.6em .9em;border-radius:12px;border:1px solid var(--line);background:var(--sf);color:var(--ink);font:inherit;margin-top:6px}
#moodTx:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#ritual{display:flex;align-items:center;justify-content:space-around;height:170px;overflow:hidden}
.rm{animation:toLuma .9s 1.6s ease-in forwards}
.rs{position:relative;width:96px;height:96px;transform-style:preserve-3d;animation:flip .9s .35s ease-in-out forwards}
.rf,.rb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.rf .ic2{width:96px;height:96px}
.rb{transform:rotateY(180deg);border-radius:50%;background:#cdbf9f;color:#2B323B;font-size:15px;text-align:center;padding:12px;line-height:1.3;box-shadow:inset 0 0 0 3px rgba(111,139,111,.6)}
.rl .luma{width:96px;display:block}
@keyframes flip{to{transform:rotateY(180deg)}}
@keyframes toLuma{to{transform:translateX(120px) scale(.25);opacity:0}}
.cs{position:relative;height:130px;display:grid;place-items:center}
.sb{width:96px;height:96px}
.sb.break{animation:shake .45s linear,vanish .2s .45s forwards}
@keyframes shake{20%{transform:translateX(-4px) rotate(-4deg)}40%{transform:translateX(4px) rotate(4deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes vanish{to{opacity:0;transform:scale(.7)}}
.pt{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;opacity:0;animation:burst 1.4s calc(.45s + var(--d)) ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3)}}
.msgc{opacity:0;text-align:center;min-height:3em;margin-top:6px}
.msgc.in{animation:fin 1s .9s forwards}
@keyframes fin{to{opacity:1}}
.luma{width:min(66vw,270px);height:auto;overflow:visible;cursor:pointer;display:block}
.luma .halo{opacity:.4;transition:fill .9s;animation:pulse 5s ease-in-out infinite}
.luma .body{transform-origin:100px 204px;animation:breathe 4.5s ease-in-out infinite}
.luma .sprout{transform-origin:100px 52px;transform:scale(0);transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.luma.has .sprout{transform:scale(1)}
.luma .eo{display:block}.luma .ec,.luma .zz{display:none}
.luma.asleep .eo{display:none}.luma.asleep .ec,.luma.asleep .zz{display:block}
.luma.asleep .body{animation-duration:7s}
.luma.joy .body{animation:hop .9s ease-out}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
@keyframes pulse{50%{opacity:.62}}
@keyframes hop{30%{transform:translateY(-16px) scale(.97,1.04)}60%{transform:translateY(0) scale(1.05,.95)}}
.fl{z-index:3;position:absolute;top:30%;left:50%;font-size:26px;pointer-events:none;animation:fl 1.5s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}

.banner{margin:6px 0 0;padding:14px 16px;border-radius:var(--r);background:var(--sf);font-size:15px}
.sw{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sw i{width:26px;height:26px;border-radius:50%;border:1px solid var(--line)}

.pc{position:relative;margin-top:10px;padding:16px 18px 16px 18px;border-radius:6px;background:color-mix(in srgb,var(--ink) 4%,var(--bg));border:1px solid var(--line);overflow:hidden}
.pc .st{height:6px;display:flex;margin:-16px -18px 12px}
.pc .st i{flex:1}
.pc p{font-size:15px}.pc small{color:var(--sub)}
.pc .stamp{position:absolute;right:14px;top:22px;width:44px;height:44px;border-radius:50%;border:1.5px dashed var(--sub);display:grid;place-items:center;color:var(--sub);font-size:12px;transform:rotate(8deg)}

/* tasks */
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1}.row .t small{display:block;color:var(--sub);font-size:13px;line-height:1.4}
.row .p{color:var(--sub);font-size:14px;min-width:2.6em;text-align:right}
.btn{padding:.45em 1.1em;border-radius:999px;background:var(--ink);color:var(--bg);font-size:15px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* compare slider */
.cmp{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:var(--r);touch-action:pan-y;user-select:none;background:var(--sf)}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .bf{clip-path:inset(0 calc(100% - var(--p,50%)) 0 0);filter:saturate(.55) brightness(.92)}
.cmp .hd{position:absolute;top:0;bottom:0;left:var(--p,50%);width:2px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.25)}
.cmp .hd b{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center;font-weight:400;font-size:13px;color:#2B323B;letter-spacing:-2px}
.cmp .tg{position:absolute;bottom:10px;padding:2px 10px;border-radius:99px;background:rgba(43,50,59,.62);color:#fff;font-size:12px}
.cmp .tg.l{left:10px}.cmp .tg.r{right:10px}
.card{margin-top:18px}
.meta{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--sub);font-size:14px}
.meta i{width:16px;height:16px;border-radius:50%}
.meta button{margin-left:auto;color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--sub);padding:26px 0}
.rt{display:flex;align-items:center;gap:14px}
.gear{color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.bt{display:flex;flex-direction:column;gap:6px}.bt .btn{padding:.3em .9em;font-size:14px}
.ic{position:relative;flex:none;width:52px;height:52px;border-radius:14px;background:var(--sf);display:grid;place-items:center}
.ic svg{width:34px;height:34px}.ic img{position:absolute;inset:9px;width:34px;height:34px;object-fit:contain}

/* slips */
.slip{display:flex;align-items:center;gap:12px;padding:16px;margin-top:12px;border-radius:var(--r);background:var(--sf);border-left:5px solid var(--amber)}
.slip .t{flex:1}.slip .t b{font-weight:400;font-size:18px;display:block}.slip .t small{color:var(--sub);font-size:13px}

/* dialogs */
dialog{border:0;border-radius:24px;background:var(--bg);color:var(--ink);padding:22px;width:min(92vw,400px);max-height:90vh;overflow:auto;margin:auto}
dialog::backdrop{background:rgba(43,50,59,.55);backdrop-filter:blur(3px)}
dialog h3{font-weight:400;font-size:20px;margin-bottom:12px}
dialog .act{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:3/4;border-radius:var(--r);border:1.5px dashed var(--sub);display:grid;place-items:center;text-align:center;cursor:pointer;overflow:hidden;font-size:15px}
.tile small{color:var(--sub)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.tile.set{border-style:solid;border-color:transparent}.tile.set img{display:block}.tile.set span{display:none}
.ring{display:block;margin:6px auto;width:150px;height:150px}
.ring circle{fill:none;stroke-width:8}
.ring .tr{stroke:var(--line)}.ring .pg{stroke:var(--ink);stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset .5s}
.ring text{fill:var(--ink);font-size:20px;text-anchor:middle;dominant-baseline:central;font-family:inherit}

/* ---------- image + color ---------- */
const fresh=f=>Date.now()-f.lastModified<12e4;
const loadImg=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u});
function shrink(img,max=480){const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k|0;c.height=img.height*k|0;c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}
function dominant(cv){
 const s=document.createElement('canvas');s.width=s.height=48;const x=s.getContext('2d');x.drawImage(cv,0,0,48,48);
 const d=x.getImageData(0,0,48,48).data,m={};
 for(let i=0;i<d.length;i+=4){
  const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),w=.2+(mx?(mx-mn)/mx:0),k=(r>>5)<<6|(g>>5)<<3|b>>5,o=m[k]||(m[k]={w:0,r:0,g:0,b:0});
  o.w+=w;o.r+=r*w;o.g+=g*w;o.b+=b*w;
 }
 const t=Object.values(m).sort((a,b)=>b.w-a.w)[0];
 return '#'+[t.r,t.g,t.b].map(v=>Math.round(v/t.w).toString(16).padStart(2,'0')).join('');
}
$('#colorIn').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;if(!fresh(f))return toast('請現場拍攝，舊照片不能使用');
 try{addColor(dominant(shrink(await loadImg(f))));finish(TASKS.find(t=>t.id==='color'),20)}catch{toast('這張圖讀不了，換一張試試')}

/* ---------- before/after slider ---------- */
function slider(b,a){
 const el=document.createElement('div');el.className='cmp';el.tabIndex=0;
 el.setAttribute('role','slider');el.setAttribute('aria-label','之前與之後對比');el.setAttribute('aria-valuemin',0);el.setAttribute('aria-valuemax',100);
 el.innerHTML=`<img src="${a}" alt="之後"><img class="bf" src="${b}" alt="之前"><div class="hd"><b>‹›</b></div><span class="tg l">混沌</span><span class="tg r">微光</span>`;
 let p=50;const set=v=>{p=Math.max(0,Math.min(100,v));el.style.setProperty('--p',p+'%');el.setAttribute('aria-valuenow',Math.round(p))};set(50);
 const mv=e=>{const r=el.getBoundingClientRect();set((e.clientX-r.left)/r.width*100)};
 el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);mv(e);el.onpointermove=mv});
 el.addEventListener('pointerup',()=>el.onpointermove=null);
 el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')set(p-5);if(e.key==='ArrowRight')set(p+5)});
 return el;
}

/* ---------- walk (motion-verified) ---------- */
const WALK=180,NEED=8,MSG0='帶著手機走動三分鐘，小苔會感受到你的腳步';
let wi=null,w0=0,wAvg=null,wBk=new Set(),wSensor=false;
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function onMotion(e){
 const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
 wSensor=true;const m=Math.hypot(a.x,a.y,a.z||0);
 wAvg=wAvg==null?m:wAvg+(m-wAvg)*.02;
 if(Math.abs(m-wAvg)>1.2)wBk.add(Math.floor((Date.now()-w0)/1e4));
}
function walkStop(){clearInterval(wi);wi=null;removeEventListener('devicemotion',onMotion)}
function walkTick(){
 const el=Math.floor((Date.now()-w0)/1000),left=Math.max(0,WALK-el);
 $('#wt').textContent=mmss(left);$('#pg').style.strokeDashoffset=327*(1-Math.min(1,el/WALK));
 if(left<=0)walkEnd();
}
function walkEnd(){
 walkStop();
 if(wBk.size>=NEED){$('#walkDlg').close();finish(TASKS.find(t=>t.id==='walk'),30);return}
 $('#walkMsg').textContent='小苔好像沒感受到您的移動，建議稍微走動後再回來喔！'+(wSensor?'':'（這個裝置讀不到動作感測器）');
 $('#walkGo').textContent='重新判定';$('#walkGo').hidden=false;$('#walkPart').hidden=false;
}
async function walkStart(){
 try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}catch{}
 w0=Date.now();wAvg=null;wBk=new Set();wSensor=false;
 addEventListener('devicemotion',onMotion);
 $('#walkGo').hidden=true;$('#walkPart').hidden=true;$('#walkMsg').textContent='走動中，小苔在感受…';
 clearInterval(wi);wi=setInterval(walkTick,500);walkTick();
}
function openWalk(){
 walkStop();$('#wt').textContent=mmss(WALK);$('#pg').style.strokeDashoffset=327;
 $('#walkMsg').textContent=MSG0;$('#walkGo').textContent='開始走';$('#walkGo').hidden=false;$('#walkPart').hidden=true;$('#walkDlg').showModal();
}
$('#walkGo').onclick=walkStart;
$('#walkPart').onclick=()=>{$('#walkDlg').close();finish(TASKS.find(t=>t.id==='walk'),15)};
$('#walkX').onclick=()=>$('#walkDlg').close();

const RESP={

let ob={q:-1,ans:[]};
function obResult(){
 const a=ob.ans,v=a.filter(x=>x!==null&&x!==undefined),avg=v.length?v.reduce((x,y)=>x+y,0)/v.length:0;
 let lv=avg<.9?'A1':avg<1.7?'A2':avg<2.4?'B':'C';
 if(a[0]===0||a[3]===0)lv='A1';
 else if(a[3]===1&&(lv==='B'||lv==='C'))lv='A2';
 return lv;
}
function startOnb(){
 ob={q:-1,ans:Array(6).fill(null)};
 $('#obL').innerHTML=luma();applyGlow();

}
function obRender(){
 const b=$('#obB'),n=ob.q;let h='';
 if(n<0){
  h=`<h2 class="obT">允許停滯，<br>記錄痕跡，<br>微光前行。</h2><p class="obP">這裡沒有懲罰，也沒有打卡壓力。<br>沒做到的日子，就讓它空白著。<br>你只要在這裡就好。</p><div class="obA"><button class="btn" data-ob="next">繼續</button></div>`;
 }else if(n<6){
  const Q=OQ[n];
  h=`<p class="obS">最近的心情，大概是哪一種狀態呢？</p><h3 class="obQ">${Q.q}</h3><div>${Q.o.map((t,i)=>`<button type="button" class="opt${ob.ans[n]===i?' on':''}" data-pick="${i}"><span class="og" style="--g:${(i+1)/4}"></span><span><b>${t}</b></span></button>`).join('')}</div>
  <div class="obN"><span class="dots">${Array.from({length:6},(_,i)=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span><span><button class="gear" data-ob="back" ${n?'':'hidden'}>上一題</button> <button class="gear" data-ob="skip">先跳過</button></span></div>
  <p class="obS" style="margin-top:14px">沒有對錯，答案只用來幫小苔選任務，不會被保存。</p>`;
 }else{
  ob.lv=obResult();ob.gift=ob.ans[0]===0||ob.lv==='A1';
  h=`<h3 class="obQ">${RESP[ob.lv]}</h3><p class="obP">今日能量 · ${ob.lv} · ${LV[ob.lv].tag}<br><small>之後隨時可以在首頁切換。</small></p>`
   +(ob.gift?`<p class="obG">已把一張「完全躺平許可」放進你的背包。</p>`:'')
   +(ob.lv==='A1'?`<p class="obH">心裡太沉重的時候，也可以打安心專線 1925（24 小時、免費），或找一位信任的人說說話。</p>`:'')
   +`<div class="obA"><button class="btn" data-ob="done">進入微光宇宙</button> <button class="gear" data-ob="back">回上一題</button></div>`;
 }
 b.innerHTML=h;b.classList.remove('pgin');void b.offsetWidth;b.classList.add('pgin');
}
function obDone(){
 S.userLevel=ob.lv;S.onboarded=true;
 if(ob.gift)S.bag.push({uid:Date.now()+'-'+Math.random().toString(36).slice(2),t:'完全躺平許可',s:'今天可以沒有產出',c:0});
 save();$('#onb').classList.add('out');setTimeout(()=>{$('#onb').hidden=true},700);

$('#onb').addEventListener('click',e=>{

 if(pk){
  const n=ob.q;ob.ans[n]=+pk.dataset.pick;

/* ---------- offline wander ---------- */
function wander(){
 const now=Date.now(),last=S.lastVisit;S.lastVisit=now;
 if(!last)return{tier:'new'};
 const dt=now-last,h=Math.max(1,Math.round(dt/H));
 if(dt<2*H)return{tier:'rest',dt,h};
 const rel=takeStone();
 if(dt<24*H)return{tier:'out',dt,h,rel};
 const i0=Math.floor(last/H)%SPECIAL.length,[place,item]=SPECIAL[i0];
 const card={ts:now,place,item,hours:h,colors:S.colors.slice(0,5)};
 if(rel)card.rel='小苔今天去了'+place+'，順手把寫著「'+(rel.text||rel.mood)+'」的石頭'+DROPS[i0]+'。';
 S.postcards.unshift(card);S.postcards=S.postcards.slice(0,20);S.earned+=20;
 return{tier:'postcard',dt,h,card};
}

 L.classList.toggle('asleep',r.tier==='rest'||r.tier==='postcard');L.classList.toggle('small',r.tier==='postcard');
 b.hidden=r.tier==='new';
 if(r.tier==='rest'){b.textContent='小苔在房間裡睡著了，輕點牠叫醒。';say('嘘，小苔在睡')}
 if(r.tier==='out'){b.innerHTML=`小苔出門逛了約 ${r.h} 小時，剛回來。${S.colors.length?'帶著你收集的顏色。':'還沒有顏色可以帶，下次拍一個給牠吧。'}${r.rel?'<br>背包裡寫著「'+esc(r.rel.text||r.rel.mood)+'」的石頭，已經放在遠方了。':''}`+sw()}
 if(r.tier==='postcard'){say('小苔縮成小小一團睡著了，輕點牠叫醒');b.innerHTML=`小苔離開了 ${r.h} 小時，帶回一張明信片。+20 微光點數`+sw();$('#pcBody').innerHTML=pcHTML(r.card);$('#pcDlg').showModal();renderPts()}
}
$('#pcOk').onclick=()=>$('#pcDlg').close();
function renderHome(){$('#pcWrap').innerHTML=S.postcards[0]?'<h2>最近的明信片</h2>'+pcHTML(S.postcards[0]):''}

const stamp=()=>{S.lastVisit=Date.now();save()};
addEventListener('pagehide',stamp);
document.addEventListener('visibilitychange',()=>{
 if(document.hidden)return stamp();
 if(Date.now()-S.lastVisit>=2*H){applyWander(wander());save()}
});

/* ---------- init ---------- */
$('#stage').addEventListener('click',e=>{if(e.target.closest('.guest'))return;
 const l=$('.luma');
 if(l.classList.contains('asleep')){l.classList.remove('asleep');$('#banner').hidden=true;say('你來了，我們慢慢來')}
 else say(rnd(LINES));
 joy();
});
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
$$('.themes button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;applyTheme();save()});
applyAssets();applyTheme();applyGlow();applyRoom();renderPts();renderTasks();renderCards();renderBag();renderHome();go('home');
const r=wander();applyWander(r);save();
if(Math.random()<.5)spawnGuest();
if(S.onboarded===false)startOnb();else if(!S.userLevel)openLevel();
hideSplash();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
